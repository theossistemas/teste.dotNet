version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: TheosLivraria-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TheosLivraria@2025
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - TheosLivraria-network

  api:
    image: your-dotnet-image:latest
    container_name: TheosLivraria-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;User Id=sa;Password=TheosLivraria@2025;Database=TheosLivraria;TrustServerCertificate=True;
      - Jwt__Key=6gvt5EFIyn2gG9CnTjAanwzUSfAYYi4zuyCxyW6a9maxhpTU02
      - Jwt__Issuer=TheosLivraria
      - Jwt__Audience=TheosLivrariaUsers
    ports:
      - "5000:80"
    depends_on:
      - sqlserver
    networks:
      - TheosLivraria-network

volumes:
  sqlserver_data:
    driver: local

networks:
  TheosLivraria-network:
    driver: bridge
